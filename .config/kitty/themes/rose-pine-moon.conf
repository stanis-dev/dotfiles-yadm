# Rosé Pine Moon.
#
# Lower saturation than Tokyo Night everywhere, warmer greys, no true
# neon. This is the Rosé Pine project's own terminal mapping. Switch
# to it once Neovim follows (rose-pine.nvim, variant "moon");
# before that the Neovim pane stays navy inside a plum window.

background #232136
foreground #e0def4

# Cursor: the theme's "muted" grey; text under it inverts.
cursor #6e6a86
cursor_text_color #e0def4

# Selection: "highlight med".
selection_background #44415a
selection_foreground #e0def4

# 0 black = overlay
color0 #393552
# 1 red = love
color1 #eb6f92
# 2 green = pine (a teal; this is the official choice)
color2 #3e8fb0
# 3 yellow = gold
color3 #f6c177
# 4 blue = foam
color4 #9ccfd8
# 5 magenta = iris
color5 #c4a7e7
# 6 cyan = rose
color6 #ea9a97
# 7 white = text
color7 #e0def4
# 8 bright black = muted (dim text)
color8 #6e6a86
# 9-15: bright variants equal the normal ones
color9 #eb6f92
color10 #3e8fb0
color11 #f6c177
color12 #9ccfd8
color13 #c4a7e7
color14 #ea9a97
color15 #e0def4

# kitty-only: tab bar and split borders, which Ghostty derived from the
# background on its own. Active tab = overlay, inactive text = muted,
# active border = foam, inactive border = highlight med.
tab_bar_background #232136
active_tab_foreground #e0def4
active_tab_background #393552
inactive_tab_foreground #6e6a86
inactive_tab_background #232136
active_border_color #9ccfd8
inactive_border_color #44415a
