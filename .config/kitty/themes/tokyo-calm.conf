# Tokyo Night Storm, calmed.
#
# Same background and text as the stock theme, so Neovim and any
# other program still painting stock Tokyo Night sit flush with the
# terminal. The accents are pulled roughly a quarter of the way
# toward the background so they read as tints rather than signals.
# The stock value sits in the comment above each line, so any single
# colour can be restored on its own.

background #24283b
foreground #c0caf5

# Cursor: a shade under the text colour; text under it inverts.
cursor #a9b1d6
cursor_text_color #24283b

# Selection: Tokyo Night's own visual-mode blue.
selection_background #364a82
selection_foreground #c0caf5

# 0 black (stock #1d202f)
color0 #1d202f
# 1 red (stock #f7768e)
color1 #d67d8f
# 2 green (stock #9ece6a)
color2 #a3c58a
# 3 yellow (stock #e0af68)
color3 #d6b27f
# 4 blue (stock #7aa2f7)
color4 #86a4e0
# 5 magenta (stock #bb9af7)
color5 #b39ddb
# 6 cyan (stock #7dcfff)
color6 #8fc4e0
# 7 white (stock #a9b1d6)
color7 #a9b1d6

# 8 bright black. Stock is #414868, which almost vanishes on this
# background. tmux and most TUIs use it for dim text (borders,
# hints, inactive items), so it is raised to Tokyo Night's comment
# colour: visible, but clearly secondary.
color8 #565f89

# 9-14: bright variants equal the normal ones. kitty never maps bold
# to bright, so these only appear when a program asks for them
# explicitly, and then they should not shout either.
color9 #d67d8f
color10 #a3c58a
color11 #d6b27f
color12 #86a4e0
color13 #b39ddb
color14 #8fc4e0

# 15 bright white (stock #c0caf5)
color15 #c0caf5

# kitty-only: tab bar and split borders, which Ghostty derived from the
# background on its own. Bar = black, active tab = selection blue,
# inactive text = comment grey, active border = calmed blue.
tab_bar_background #1d202f
active_tab_foreground #c0caf5
active_tab_background #364a82
inactive_tab_foreground #565f89
inactive_tab_background #1d202f
active_border_color #86a4e0
inactive_border_color #1d202f
